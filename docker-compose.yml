services:
  postgres:
    image: postgres:16-alpine
    container_name: gestion-ejecutivos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      POSTGRES_DB: gestion_ejecutivos
    volumes:
      - gestion-ejecutivos-db-data:/var/lib/postgresql/data
    networks:
      - gestion-ejecutivos-net

  backend:
    build: .
    container_name: gestion-ejecutivos-backend
    restart: unless-stopped
    depends_on:
      - postgres
    # Los secretos se toman del .env de esta carpeta (no se escriben acá).
    # VB_WEBHOOK_SECRET lo comparte vb-api.
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      DB_NAME: gestion_ejecutivos
      DB_SYNC: "true"
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      ADMIN_EMAIL: admin@empresa.com
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD en .env}
      PORT: 3000
      VB_WEBHOOK_SECRET: ${VB_WEBHOOK_SECRET}
    networks:
      - gestion-ejecutivos-net

volumes:
  gestion-ejecutivos-db-data:

networks:
  gestion-ejecutivos-net:
    external: true
